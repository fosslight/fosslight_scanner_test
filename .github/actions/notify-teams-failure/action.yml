# SPDX-License-Identifier: Apache-2.0
name: Notify Teams on failure
description: >
  Post an Adaptive Card to a Microsoft Teams Workflow webhook
  (템플릿: 웹후크 요청이 수신되면 채널에 게시).
  Skips quietly when webhook_url is empty.
  Optionally includes a Job Summary markdown file (truncated if large).

inputs:
  webhook_url:
    description: Teams Workflow HTTP POST URL (repository secret TEAMS_WEBHOOK_URL)
    required: false
    default: ""
  detail:
    description: Optional extra detail line (e.g. job name)
    required: false
    default: ""
  summary_file:
    description: Optional path to Job Summary markdown (e.g. results/.../job_summary.md)
    required: false
    default: ""
  max_summary_chars:
    description: Max characters of summary body to include (Teams payload size limit)
    required: false
    default: "6000"

runs:
  using: composite
  steps:
    - name: Post Adaptive Card to Teams
      shell: bash
      env:
        TEAMS_WEBHOOK_URL: ${{ inputs.webhook_url }}
        DETAIL: ${{ inputs.detail }}
        SUMMARY_FILE: ${{ inputs.summary_file }}
        MAX_SUMMARY_CHARS: ${{ inputs.max_summary_chars }}
        WORKFLOW_NAME: ${{ github.workflow }}
        JOB_NAME: ${{ github.job }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [[ -z "${TEAMS_WEBHOOK_URL}" ]]; then
          echo "TEAMS_WEBHOOK_URL is not set; skip Teams notification."
          exit 0
        fi

        TITLE="❌ ${WORKFLOW_NAME} failed"
        DETAIL_TEXT="${DETAIL:-}"
        SUMMARY_TEXT=""

        if [[ -n "${SUMMARY_FILE}" && -f "${SUMMARY_FILE}" ]]; then
          SUMMARY_TEXT="$(cat "${SUMMARY_FILE}")"
        elif [[ -n "${SUMMARY_FILE}" ]]; then
          SUMMARY_TEXT="(summary file not found: ${SUMMARY_FILE})"
        fi

        max_chars="${MAX_SUMMARY_CHARS:-6000}"
        if [[ -n "${SUMMARY_TEXT}" && "${#SUMMARY_TEXT}" -gt "${max_chars}" ]]; then
          SUMMARY_TEXT="${SUMMARY_TEXT:0:${max_chars}}

… (truncated; open View run → Summary for the full result)"
        fi

        payload="$(jq -n \
          --arg title "${TITLE}" \
          --arg job "${JOB_NAME}" \
          --arg repo "${REPO}" \
          --arg ref "${REF}" \
          --arg actor "${ACTOR}" \
          --arg event "${EVENT_NAME}" \
          --arg url "${RUN_URL}" \
          --arg detail "${DETAIL_TEXT}" \
          --arg summary "${SUMMARY_TEXT}" \
          '{
            type: "message",
            attachments: [{
              contentType: "application/vnd.microsoft.card.adaptive",
              contentUrl: null,
              content: {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.4",
                body: (
                  [
                    {
                      type: "TextBlock",
                      size: "Large",
                      weight: "Bolder",
                      color: "Attention",
                      text: $title,
                      wrap: true
                    },
                    {
                      type: "FactSet",
                      facts: [
                        {title: "Job", value: $job},
                        {title: "Repository", value: $repo},
                        {title: "Ref", value: $ref},
                        {title: "Event", value: $event},
                        {title: "Actor", value: $actor}
                      ]
                    }
                  ]
                  + (if ($detail | length) > 0 then
                      [{type: "TextBlock", text: $detail, wrap: true}]
                    else [] end)
                  + (if ($summary | length) > 0 then
                      [
                        {
                          type: "TextBlock",
                          weight: "Bolder",
                          text: "Job Summary",
                          wrap: true,
                          separator: true
                        },
                        {
                          type: "TextBlock",
                          text: $summary,
                          wrap: true,
                          fontType: "Monospace"
                        }
                      ]
                    else [] end)
                ),
                actions: [{
                  type: "Action.OpenUrl",
                  title: "View run",
                  url: $url
                }]
              }
            }]
          }')"

        curl -sS -f -X POST \
          -H "Content-Type: application/json" \
          -d "${payload}" \
          "${TEAMS_WEBHOOK_URL}"
        echo "Teams notification sent."
