# SPDX-License-Identifier: Apache-2.0
# Daily fosslight_dependency tox with fosslight_util from GitHub main (not PyPI).
name: Daily fosslight_dependency Tox

on:
  schedule:
    # UTC 00:00 = KST 09:00 (once daily; heavy package-manager matrix)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-fosslight-dependency-tox
  cancel-in-progress: false

jobs:
  dependency-tox:
    name: dependency tox ${{ matrix.tox_env }} py${{ matrix.python-version }} (util@git main)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            tox_env: run_ubuntu
            assert_profile: ubuntu
          - os: windows-latest
            tox_env: run_windows
            assert_profile: windows
          - os: macos-latest
            tox_env: run_macos
            assert_profile: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java (Gradle fixtures)
        if: matrix.tox_env != 'run_macos'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pub fixtures)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go (mod fixtures)
        if: matrix.tox_env != 'run_macos'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            build-essential \
            libxml2-dev \
            libxslt-dev
          sudo npm install -g license-checker
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libxml2 libxslt
          npm install -g license-checker

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g license-checker

      - name: Make scripts executable
        shell: bash
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Install openpyxl for DEP sheet assert
        shell: bash
        run: python -m pip install --upgrade pip openpyxl

      - name: Run fosslight_dependency tox (util from git main)
        shell: bash
        env:
          RESULT_DIR: ${{ github.workspace }}/results/${{ github.run_id }}/dependency_tox/${{ matrix.tox_env }}/py${{ matrix.python-version }}
          WORK_DIR: ${{ github.workspace }}/.work/${{ matrix.tox_env }}/py${{ matrix.python-version }}
          KEEP_WORK: "0"
          DEP_REF: main
          UTIL_GIT: git+https://github.com/fosslight/fosslight_util.git@main
          TOX_ENV: ${{ matrix.tox_env }}
          ASSERT_PROFILE: ${{ matrix.assert_profile }}
          PYTHON_BIN: python
        run: ./scripts/run_dependency_tox.sh

      - name: Upload dependency tox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fosslight-dependency-tox-${{ matrix.tox_env }}-py${{ matrix.python-version }}-${{ github.run_id }}
          path: results/${{ github.run_id }}/dependency_tox/${{ matrix.tox_env }}/py${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Teams on failure
        if: failure()
        uses: ./.github/actions/notify-teams-failure
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          detail: "fosslight_dependency ${{ matrix.tox_env }} py${{ matrix.python-version }} failed (fosslight_util from GitHub main)."
          summary_file: ${{ github.workspace }}/results/${{ github.run_id }}/dependency_tox/${{ matrix.tox_env }}/py${{ matrix.python-version }}/job_summary.md
