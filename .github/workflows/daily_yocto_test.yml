# SPDX-License-Identifier: Apache-2.0
name: Daily fosslight_yocto Test

on:
  schedule:
    # 매일 오전 9시, 11시, 오후 4시 (KST)
    - cron: "0 9,11,16 * * *"
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-fosslight-yocto-test
  cancel-in-progress: false

jobs:
  fosslight-yocto:
    name: PyPI vs GitHub (fosslight_yocto)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            wget \
            curl \
            build-essential

      - name: Make scripts executable
        run: chmod +x scripts/*.sh scripts/compare_excel.py

      - name: Run fosslight_yocto comparison
        env:
          RESULT_DIR: ${{ github.workspace }}/results/${{ github.run_id }}
          WORK_DIR: ${{ github.workspace }}/.work
          KEEP_WORK: "0"
        run: ./scripts/run_yocto_test.sh

      - name: Upload yocto artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fosslight-yocto-compare-${{ github.run_id }}
          path: results/${{ github.run_id }}/yocto/
          if-no-files-found: warn
          retention-days: 30
