# SPDX-License-Identifier: Apache-2.0
# Moved from fosslight/fosslight_scanner (.github/workflows/build-daily.yml)
name: Daily fosslight_scanner Build

on:
  schedule:
    # UTC 15:30 = KST 00:30 (same schedule as the former fosslight_scanner daily build)
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-fosslight-scanner-build
  cancel-in-progress: false

jobs:
  build:
    name: Build & tox (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout fosslight_scanner
        uses: actions/checkout@v4
        with:
          repository: fosslight/fosslight_scanner
          ref: main
          path: fosslight_scanner

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install dependencies
        working-directory: fosslight_scanner
        run: |
          python -m pip install --upgrade pip
          pip install tox
          pip install .
          sudo npm install -g license-checker

      - name: Checkout example repository and scan
        working-directory: fosslight_scanner
        run: |
          mkdir -p test
          cd test
          git clone https://github.com/LGE-OSS/example
          cd example
          fosslight_scanner -p .

      - name: Run Tox
        working-directory: fosslight_scanner
        run: |
          tox -e test_run
