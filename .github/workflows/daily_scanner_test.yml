# SPDX-License-Identifier: Apache-2.0
name: Daily FOSSLight Scanner Test

on:
  schedule:
    # 매일 오전 9시, 11시, 오후 4시 (KST)
    - cron: "0 9,11,16 * * *"
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-fosslight-scanner-test
  cancel-in-progress: false

jobs:
  compare-pypi-vs-github:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            wget \
            curl \
            build-essential

      - name: Make scripts executable
        run: chmod +x scripts/run_daily_test.sh scripts/compare_excel.py

      - name: Run PyPI vs GitHub comparison test
        env:
          RESULT_DIR: ${{ github.workspace }}/results/${{ github.run_id }}
          WORK_DIR: ${{ github.workspace }}/.work
          KEEP_WORK: "0"
        run: ./scripts/run_daily_test.sh

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fosslight-compare-${{ github.run_id }}
          path: |
            results/${{ github.run_id }}/FOSSLight-Report_pypi.xlsx
            results/${{ github.run_id }}/FOSSLight-Report_github.xlsx
            results/${{ github.run_id }}/excel_diff.txt
            results/${{ github.run_id }}/excel_diff.json
            results/${{ github.run_id }}/fosslight_compare/
          if-no-files-found: warn
          retention-days: 30
